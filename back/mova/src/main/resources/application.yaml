spring:
  application:
    name: mova

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres_db}
    username: ${POSTGRES_USER:postgres_user}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    open-in-view: false

    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}

    show-sql: ${SHOW_SQL:true}

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

app:
  jwtSecret: ${JWT_SECRET:MySecretKeyDefaultToDevelopment}
  jwtExpirationInMs: ${JWT_EXPIRATION:86400000}
  jwtResetExpirationInMs: ${JWT_RESET_EXPIRATION:900000}
  passwordResetBaseUrl: ${PASSWORD_RESET_BASE_URL:http://localhost:3000}
  avatar:
    upload-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
    base-url: ${AVATAR_BASE_URL:http://localhost:8080/uploads/avatars}
