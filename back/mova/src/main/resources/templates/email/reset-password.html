<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperacao de senha</title>
</head>
<body>
<p>Ola, <span th:text="${name}">usuario</span>!</p>
<p>Recebemos uma solicitacao para redefinir sua senha.</p>
<p>
    Use o token abaixo para concluir a alteracao:
</p>
<p><strong th:text="${token}">token</strong></p>
<p>
    Ou acesse:
    <a th:href="${resetLink}" th:text="${resetLink}">link</a>
</p>
<p>Se voce nao solicitou esta alteracao, ignore este e-mail.</p>
</body>
</html>
